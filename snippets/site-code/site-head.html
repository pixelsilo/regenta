<!--- ps-hide="on-touch" --->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Function to handle element visibility
    function handleVisibility() {
      var isTouchDevice = window.matchMedia("(pointer: coarse)").matches || 'ontouchstart' in window;
      var isSmallScreen = window.innerWidth <= 991;
      var divsToResize = document.querySelectorAll('[ps-hide="on-touch"]');

      divsToResize.forEach(function(div) {
        if (isTouchDevice && isSmallScreen) {
          div.style.width = '0px';
          div.style.height = '0px';
          div.style.overflow = 'hidden'; // Hides content on touch devices with small screens
        } else {
          div.style.width = '';
          div.style.height = '';
          div.style.overflow = ''; // Resets styles on larger screens or non-touch devices
        }
      });
    }
    // Run on load and resize
    handleVisibility();
    window.addEventListener("resize", handleVisibility);
  });
</script>

<!-- pixelsilo.net - ps="grow"-->
<style>
/* Default hidden state */
[ps="grow"] {
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
}
/* When element is in view */
[ps="grow"].is-visible {
    opacity: 1;
    transform: scale(1);
}
/* Reset transition delay if is-visible class is removed */
[ps="grow"]:not(.is-visible) {
    transition-delay: 0s !important;
}
/* Forces visability in Webflow Editor */
.w-editor [ps="grow"],
.wf-editor [ps="grow"] {
    opacity: 1 !important;
    transform: scale(1) !important;
    transition: none !important;
}
</style>
