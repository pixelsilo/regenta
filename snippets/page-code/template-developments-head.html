<!-- No Index Switch -->
<script>
var shouldIndexPage = {{wf {&quot;path&quot;:&quot;live-on-site&quot;,&quot;type&quot;:&quot;Bool&quot;\} }};
function updateNoIndexTag() {
  var noIndexTag = document.head.querySelector('meta[name="robots"][content="noindex"]');
  if (shouldIndexPage) {
    noIndexTag && document.head.removeChild(noIndexTag);
  } else {
    if (!noIndexTag) {
      var meta = document.createElement('meta');
      meta.name = 'robots';
      meta.content = 'noindex';
      document.head.appendChild(meta);
    }
  }
}
document.addEventListener('DOMContentLoaded', updateNoIndexTag);
</script>
