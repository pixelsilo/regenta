<script>
document.addEventListener('DOMContentLoaded', () => {
  const openButtons = document.querySelectorAll('[brochure="open"]');
  const closeButtons = document.querySelectorAll('[brochure="close"]');
  const component = document.querySelector('.brochure-download_component');

  openButtons.forEach(button => {
    button.addEventListener('click', e => {
      e.preventDefault();
      component?.classList.add('open');
    });
  });

  closeButtons.forEach(button => {
    button.addEventListener('click', e => {
      e.preventDefault();
      component?.classList.remove('open');
    });
  });
});
</script>
