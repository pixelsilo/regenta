<!--- FormSpark dynamic post action --->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const serviceContactForm = document.getElementById('main-contact-form');

  if (serviceContactForm) {
    serviceContactForm.action = 'https://submit-form.com/REDACTED';
  } else {
    console.error('Form with the ID "main-contact-form" not found');
  }
});
</script>

<!-- Add form fields to the data layer and update the button text -->
<script>
$(document).ready(function() {
  $('#main-contact-form').submit(function(event) {
    event.preventDefault();

    // Change the submit button text to "Please wait..."
    var submitButton = $(this).find('input[type="submit"]');
    var originalButtonText = submitButton.val();
    submitButton.val('Please wait...');

    // Collect form field data
    var formData = {
      'title': $('#title').val(),
      'fname': $('#fname').val(),
      'lname': $('#lname').val(),
      'email': $('#email').val(),
      'phone': $('#phone').val(),
      'message': $('#message').val(),
      'privacy-accept': $('#privacy-accept').is(':checked')
    };

    // Push the form data to the data layer
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      'event': 'formSubmission',
      'formData': formData
    });

    // Submit the form
    this.submit();
  });
});
</script>
