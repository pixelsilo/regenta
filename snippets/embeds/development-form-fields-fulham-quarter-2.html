<!--- update bedrooms selection based on max bedrooms --->
<script>
var maxBedrooms = 3;

function updateBedroomOptions() {
    var select = document.getElementById('bedrooms');
    select.innerHTML = '<option value=""></option>';

    for (var i = 1; i <= maxBedrooms; i++) {
        var option = document.createElement('option');
        option.value = i;
        option.textContent = i;
        select.appendChild(option);
    }
}

updateBedroomOptions();
</script>

<!--- make extra from fields required if on --->
<script>
var shouldBeRequired = false;
function updateRequiredFields() {
    var ownershipField = document.getElementById('ownership');

    if (shouldBeRequired) {
        ownershipField.setAttribute('required', '');
    } else {
        ownershipField.removeAttribute('required');
    }
}
updateRequiredFields();
</script>
